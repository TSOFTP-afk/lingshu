[pytest]
addopts =
    --import-mode=importlib
    -m "not performance and not runtime"
testpaths =
    test_text_importer.py
    test_database_extensions.py
    test_core_modules.py
    tests
norecursedirs =
    .git
    .pytest_cache
    build
    dist
    release
    vendor
    _MEI*
    tmp_focus_test*
    _changes
    .uploads
    .build_tools
    star_graph_enhancement
    tests/runtime_e2e
markers =
    performance: opt-in performance and scale checks
    runtime: 需要真实运行环境的端到端测试（默认跳过）
    preexisting: 存量失败隔离标记（由根 conftest 自动打 xfail，见 tests/preexisting_failures.py）
