[pytest]
addopts =
    --import-mode=importlib
    -m "not performance"
testpaths =
    test_text_importer.py
    test_database_extensions.py
    test_core_modules.py
    tests
norecursedirs =
    .git
    .pytest_cache
    build
    dist
    release
    vendor
    _MEI*
    tmp_focus_test*
    _changes
    .uploads
    .build_tools
    star_graph_enhancement
markers =
    performance: opt-in performance and scale checks
