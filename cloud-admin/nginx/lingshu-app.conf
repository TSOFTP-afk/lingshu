# ============================================================
# lingshu-app 主应用 Nginx 配置
# ------------------------------------------------------------
# 用途：服务 lingshu-app（Vue 3 + createWebHistory）主应用前端，
#       修复刷新深链（如 /workspace/books/123/volumes/4/chapters/5）
#       时返回 404 白屏的问题——通过 SPA fallback 将所有未匹配路由
#       回退到 index.html，交由 Vue Router 处理。
# 部署位置：/etc/nginx/conf.d/lingshu-app.conf（或 sites-available 软链）
# 需替换变量：
#   1. server_name  lingshu.example.com  → 实际主应用域名
#   2. root         /home/CODEX/lingshu-cloud/lingshu-app → 实际前端构建产物目录（dist 内容所在路径）
#   3. proxy_pass   127.0.0.1:8787       → 实际后端服务地址/端口
#   4. ssl_certificate / ssl_certificate_key → 实际 TLS 证书路径
# ============================================================

# ============================================================
# HTTP 80 → HTTPS 301 重定向
# ============================================================
server {
    listen 80;
    server_name lingshu.example.com; # 部署时替换为实际域名
    return 301 https://$host$request_uri;
}

# ============================================================
# HTTPS 443 — 主服务块
# 部署时请将 ssl_certificate / ssl_certificate_key 替换为实际证书路径
# ============================================================
server {
    listen 443 ssl;
    server_name lingshu.example.com; # 部署时替换为实际域名

    # --- TLS 证书（占位路径，部署时替换）---
    ssl_certificate     /etc/nginx/ssl/lingshu.crt;
    ssl_certificate_key /etc/nginx/ssl/lingshu.key;

    # --- SSL 安全配置 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling（部署时取消注释并填入正确 URL）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;

    # --- 前端构建产物目录（部署时替换为实际 dist 路径）---
    root /home/CODEX/lingshu-cloud/lingshu-app;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TODO: 后续需配合前端 nonce 改造，将 script-src 改为 'self' 'nonce-{server_nonce}'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://www.ling-shu.top wss://www.ling-shu.top;" always;

    # 请求体大小限制
    client_max_body_size 10m;

    # --- gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # SPA fallback —— 修复刷新深链白屏的关键：
    # 未匹配到静态文件的请求一律回退到 index.html，交由 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源直接返回（try_files 已覆盖，显式声明提高可读性）
    location /assets/ {
        try_files $uri =404;
        # 静态资源带长缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
