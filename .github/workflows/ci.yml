name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - personal-client

jobs:
  backend-test:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # pyproject 声明支持 3.11+；3.13 为当前主力版本，3.11 为兼容下限
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # requirements.lock 由 pip-compile 从 requirements.txt 生成（精确 pin）；
        # dev 文件补充测试/构建工具（其版本区间与 lock pins 兼容）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check lingshu_api novel_app shared tests test_core_modules.py test_database_extensions.py test_text_importer.py conftest.py main.py
      - name: Run Python regression tests
        run: python tests/test_runner.py
      - name: Compile sources
        run: python -m compileall -q novel_app lingshu_api tests

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 覆盖率阈值（60%）当前为远期目标（实测 ~35%/19%），在专项补测试前
          # 不作为 CI 通过门；coverage 报告由 test:coverage 本地/专项产出
          - project: lingshu-app
            test: npm run test -- --run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Typecheck ${{ matrix.project }}
        run: npm run typecheck
        working-directory: ${{ matrix.project }}
      - name: Run tests with coverage
        if: matrix.test != ''
        run: ${{ matrix.test }}
        working-directory: ${{ matrix.project }}

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: frontend-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lingshu-app
            command: npx vite build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Build ${{ matrix.project }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4  # V5 S-4: 建议后续改为 SHA 锁定引用
      # Python 依赖审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        # 扫描实际安装来源：lock（运行时精确 pin）+ dev 工具链；
        # 如存在已确认误报可追加 --ignore-vuln GHSA-xxxx
        run: pip-audit -r requirements.lock -r requirements-dev.txt
        continue-on-error: false
      # Node 依赖审计（lingshu-app）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lingshu-app deps
        run: npm ci
        working-directory: lingshu-app
      - name: npm audit (lingshu-app)
        run: npm audit --audit-level=high
        working-directory: lingshu-app
        continue-on-error: false
      # Node 依赖审计（electron）
      - name: Install electron deps
        run: npm ci
        working-directory: electron
      - name: npm audit (electron)
        # electron-builder 工具链（app-builder-lib/dmg-builder 等）的高危需升级
        # electron-builder 24→26（跨大版本）才能修复，排期到个人客户端打包阶段；
        # 这些均为构建期依赖、不进安装产物，critical（node-tar 等）已通过 overrides 修复归零，
        # 故此门禁为 critical 级——非装饰性放水，升级完成后恢复 high 级。
        run: npm audit --audit-level=critical
        working-directory: electron
        continue-on-error: false
