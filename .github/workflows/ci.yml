name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check novel_app lingshu_api
      - name: Run Python regression tests
        run: python tests/test_runner.py
      - name: Compile sources
        run: python -m compileall -q novel_app lingshu_api tests

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lingshu-app
          - project: admin-web
          - project: cloud-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ${{ matrix.project }}

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: frontend-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lingshu-app
            command: npm run build
          - project: web
            command: npm run build
          - project: admin-web
            command: npm run build
          - project: cloud-admin
            command: npm run build
          - project: lingjing-app
            command: npm run build:renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Build ${{ matrix.project }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}
