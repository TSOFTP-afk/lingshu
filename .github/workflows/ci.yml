name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check novel_app lingshu_api
      - name: Run Python regression tests
        run: python tests/test_runner.py
      - name: Compile sources
        run: python -m compileall -q novel_app lingshu_api tests

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lingshu-app
          - project: admin-web
          - project: cloud-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ${{ matrix.project }}

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: frontend-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lingshu-app
            command: npm run build
          - project: web
            command: npm run build
          - project: admin-web
            command: npm run build
          - project: cloud-admin
            command: npm run build
          - project: lingjing-app
            command: npm run build:renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Build ${{ matrix.project }}
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4  # V5 S-4: 建议后续改为 SHA 锁定引用
      # Python 依赖审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        # 扫描 requirements.txt 中的已知 CVE；如存在已确认误报可追加 --ignore-vuln GHSA-xxxx
        run: pip-audit -r requirements.txt
        continue-on-error: false
      # Node 依赖审计（lingshu-app）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lingshu-app deps
        run: npm ci
        working-directory: lingshu-app
      - name: npm audit (lingshu-app)
        run: npm audit --audit-level=high
        working-directory: lingshu-app
        continue-on-error: false
      # Node 依赖审计（electron）
      - name: Install electron deps
        run: npm ci
        working-directory: electron
      - name: npm audit (electron)
        run: npm audit --audit-level=high
        working-directory: electron
        continue-on-error: false
      # Node 依赖审计（cloud-admin）
      - name: Install cloud-admin deps
        run: npm ci
        working-directory: cloud-admin
      - name: npm audit (cloud-admin)
        run: npm audit --audit-level=high
        working-directory: cloud-admin
        continue-on-error: false
