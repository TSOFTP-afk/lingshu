# ============================================================
# 灵枢 Redis 缓存服务 — hybrid-database-architecture spec Task 4.9
# ============================================================
# 用途：
#   - 云端部署（ling-shu.top）：与 FastAPI 后端同机/同网络部署，提供书籍树/章节/分析状态缓存 + 分布式锁
#   - 本地开发：开发者可 `docker compose up -d redis` 启用缓存层
#
# 桌面端（Electron 打包）说明：
#   桌面应用不依赖 Redis。novel_app/db/redis_client.py 在 Redis 不可用时
#   自动优雅降级（所有缓存方法返回 None/False，分布式锁返回伪 token），
#   业务逻辑不受影响。如需在桌面端启用缓存，设置环境变量 REDIS_URL 即可。
#
# 环境变量（与 novel_app/db/redis_client.py 对齐）：
#   REDIS_URL         — 完整连接 URL（优先），如 redis://:密码@127.0.0.1:6379/0
#   REDIS_HOST        — 默认 127.0.0.1
#   REDIS_PORT        — 默认 6379
#   REDIS_DB          — 默认 0
#   REDIS_PASSWORD    — 默认空（生产环境必须设置）
# ============================================================

services:
  backend:
    build: .
    image: lingshu-backend:latest
    container_name: lingshu-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Redis 连接走 novel_app/db/redis_client.py 的标准变量；
    # 容器网络内主机名固定为 redis（服务名）。Redis 不可用时业务自动优雅降级。
    environment:
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lingshu_dev_password}
      # LINGSHU_* 透传：值从根目录 .env 或 compose 环境读取（留空则用代码默认值）
      LINGSHU_MASTER_KEY: ${LINGSHU_MASTER_KEY:-}
      LINGSHU_AI_API_KEY: ${LINGSHU_AI_API_KEY:-}
      LINGSHU_AI_BASE_URL: ${LINGSHU_AI_BASE_URL:-}
      LINGSHU_AI_MODEL: ${LINGSHU_AI_MODEL:-}
      LINGSHU_ALLOW_SERVER_KEY_FALLBACK: ${LINGSHU_ALLOW_SERVER_KEY_FALLBACK:-}
      # 需要更多 LINGSHU_* 变量时在此追加（compose 不支持通配透传）
    ports:
      - "8787:8787"
    volumes:
      # SQLite（bookstore_demo.db）落在宿主机 ./data，随容器生命周期持久
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: lingshu-redis
    restart: unless-stopped
    # 生产环境务必设置强密码（通过环境变量 REDIS_PASSWORD 传入）
    command: >
      sh -c '
        redis-server
        --requirepass "$${REDIS_PASSWORD:-lingshu_dev_password}"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
      '
    environment:
      # 通过 .env 文件或 -e 参数覆盖；此处仅给开发默认值
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lingshu_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD:-lingshu_dev_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # 缓存场景 256mb 足够；allkeys-lru 保证内存不超限
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    driver: local
