<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵枢启动中</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #f7fbff;
      background: #0b1220;
      user-select: none;
    }
    .shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(135deg, rgba(14, 22, 39, 0.90), rgba(27, 39, 65, 0.82)),
        #0b1220;
    }
    .visual {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      opacity: 0.30;
      transform: scale(1.04);
      filter: saturate(1.08);
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 28%, rgba(80, 211, 255, 0.30), transparent 30%),
        radial-gradient(circle at 14% 72%, rgba(255, 181, 105, 0.22), transparent 30%),
        linear-gradient(90deg, rgba(9, 13, 24, 0.78), rgba(9, 13, 24, 0.28));
    }
    .content {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 132px;
      gap: 28px;
      align-items: end;
      height: 100%;
      padding: 44px 46px 38px;
    }
    .brand {
      align-self: center;
      padding-top: 24px;
    }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2ae6d5, #4157ff);
      box-shadow: 0 18px 48px rgba(21, 216, 194, 0.24);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 14px 34px rgba(0, 0, 0, 0.40);
    }
    .subtitle {
      margin: 10px 0 0;
      color: rgba(234, 242, 252, 0.78);
      font-size: 14px;
    }
    .status {
      grid-column: 1 / 3;
    }
    .stage-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }
    #stage {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    #detail {
      margin: 5px 0 0;
      max-width: 420px;
      color: rgba(229, 238, 249, 0.72);
      font-size: 12px;
      line-height: 1.5;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.20);
      border-top-color: #39e6dc;
      animation: spin 0.85s linear infinite;
    }
    .track {
      position: relative;
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
    }
    .bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #25e4d0, #8ca7ff, #ffb86e);
      box-shadow: 0 0 24px rgba(37, 228, 208, 0.35);
      animation: sweep 1.25s ease-in-out infinite;
    }
    .tips {
      margin-top: 12px;
      color: rgba(231, 238, 247, 0.58);
      font-size: 11px;
    }
    .preview {
      align-self: center;
      width: 132px;
      height: 156px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05)),
        rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.30);
      padding: 16px;
    }
    .preview-line {
      height: 8px;
      margin-bottom: 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.38);
    }
    .preview-line:nth-child(2) { width: 74%; }
    .preview-line:nth-child(3) { width: 88%; }
    .preview-line:nth-child(4) { width: 58%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sweep {
      0% { transform: translateX(-105%); }
      50% { transform: translateX(70%); }
      100% { transform: translateX(245%); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div id="visual" class="visual"></div>
    <div class="wash"></div>
    <section class="content">
      <div class="brand">
        <div class="mark">灵</div>
        <h1>灵枢</h1>
        <p class="subtitle">小说创作工作台</p>
      </div>
      <div class="preview" aria-hidden="true">
        <div class="preview-line"></div>
        <div class="preview-line"></div>
        <div class="preview-line"></div>
        <div class="preview-line"></div>
      </div>
      <div class="status">
        <div class="stage-row">
          <div>
            <p id="stage">正在启动灵枢</p>
            <p id="detail">准备本地运行环境</p>
          </div>
          <div class="spinner"></div>
        </div>
        <div class="track"><div class="bar"></div></div>
        <div class="tips">本地后端、数据库和工作台会在后台依次就绪</div>
      </div>
    </section>
  </main>
  <script>
    // 安全校验：只允许相对路径图片，防止路径遍历和任意文件加载
    var ALLOWED_IMAGE_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'];
    function isImagePathAllowed(p) {
      if (typeof p !== 'string' || !p) return false;
      if (/^[\/\\]/.test(p)) return false;       // 禁止绝对路径
      if (p.includes('..')) return false;          // 禁止路径遍历
      var lower = p.toLowerCase();
      return ALLOWED_IMAGE_EXTENSIONS.some(function(ext) { return lower.endsWith(ext); });
    }
    var params = new URLSearchParams(window.location.search);
    var imagePath = params.get('image');
    if (imagePath && isImagePathAllowed(imagePath)) {
      var normalized = imagePath.replace(/\\/g, '/').replace(/"/g, '%22');
      document.getElementById('visual').style.backgroundImage = 'url("file:///' + normalized + '")';
    }
    window.setSplashStage = function setSplashStage(payload) {
      if (!payload) return;
      if (payload.stage) document.getElementById('stage').textContent = payload.stage;
      if (payload.detail) document.getElementById('detail').textContent = payload.detail;
    };
  </script>
</body>
</html>
